<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход в TikTok выполнен — fluxprod</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0e1014; color: #e8eaf0; padding: 24px;
    font: 16px/1.6 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .card {
    max-width: 640px; width: 100%; background: #151922; border: 1px solid #232936;
    border-radius: 16px; padding: 32px;
  }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { color: #cfd4e0; margin: 0 0 14px; }
  .code {
    display: block; word-break: break-all; background: #0e1014; border: 1px solid #2b3342;
    border-radius: 10px; padding: 14px; font: 13px/1.5 Consolas, monospace; color: #9ff0c4;
    margin: 12px 0 18px; user-select: all;
  }
  .hint { color: #8b93a7; font-size: 14px; }
  .err { color: #ffb4b4; }
  a { color: #7fb2ff; }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">Проверяю ответ TikTok…</h1>
  <p id="message"></p>
  <code class="code" id="value" hidden></code>
  <p class="hint" id="hint" hidden></p>
  <p class="hint">Страница нужна только для приложения fluxprod publisher.
  <a href="/">Вернуться на сайт</a></p>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const error = params.get('error') || params.get('error_description');
  const title = document.getElementById('title');
  const message = document.getElementById('message');
  const value = document.getElementById('value');
  const hint = document.getElementById('hint');
  if (code) {
    title.textContent = 'Вход выполнен';
    message.textContent = 'Скопируй строку ниже целиком и отправь её в чат — приложение обменяет её на доступ.';
    value.textContent = location.href;
    value.hidden = false;
    hint.textContent = 'Ссылка одноразовая и действует несколько минут.';
    hint.hidden = false;
  } else if (error) {
    title.textContent = 'TikTok не выдал доступ';
    title.classList.add('err');
    message.textContent = error;
  } else {
    title.textContent = 'Здесь ничего нет';
    message.textContent = 'Эта страница открывается только после авторизации приложения.';
  }
</script>
</body>
</html>
